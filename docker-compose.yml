# Lokale Entwicklung / Staging. Für Produktion siehe docs/betrieb.md und infra/docker-compose.prod.yml.
name: emden-network

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: emden
      POSTGRES_USER: emden_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      # Passwörter der eingeschränkten App-Rollen (siehe infra/postgres/init/01-roles.sh)
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD in .env setzen}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emden_owner -d emden"]
      interval: 5s
      retries: 10

  # Redis ist vorbereitet (Phase 6: Queue/Caching) und wird derzeit nicht benötigt.
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "127.0.0.1:6379:6379"

  migrate:
    build: .
    command: ["node", "packages/database/dist/cli.js", "up"]
    environment:
      DATABASE_URL: postgres://emden_owner:${POSTGRES_PASSWORD}@postgres:5432/emden
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: ["node", "apps/api/dist/main.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://emden_app:${APP_DB_PASSWORD}@postgres:5432/emden
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  bot:
    build: .
    command: ["node", "apps/bot/dist/main.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://emden_app:${APP_DB_PASSWORD}@postgres:5432/emden
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
