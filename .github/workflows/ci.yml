name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Format, Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Altmodule des Bots prüfen
        run: pnpm --filter @enrp/bot check:legacy
      - name: Abhängigkeitsprüfung
        run: pnpm audit --prod --audit-level high

  test:
    name: Tests (Unit + Integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: enrp
          POSTGRES_PASSWORD: enrp
          POSTGRES_DB: enrp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U enrp" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://enrp:enrp@localhost:5432/enrp_test
      TEST_RESTORE_DATABASE_URL: postgres://enrp:enrp@localhost:5432/enrp_restore_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: PostgreSQL-Client (pg_dump/pg_restore) für Backup-Tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: PGPASSWORD=enrp psql -h localhost -U enrp -d enrp_test -c 'create database enrp_restore_test'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Build & Container
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: docker/setup-buildx-action@v3
      - name: Container bauen (ohne Push)
        run: |
          for target in api worker bot dashboard; do
            docker buildx build --target "$target" --tag "enrp-$target:ci" --load .
          done
