# Produktions-Overlay: docker compose -f docker-compose.yml -f infra/docker-compose.prod.yml up -d
# Ergänzt Caddy als HTTPS-Terminierung; die API ist nur intern erreichbar.
services:
  api:
    ports: !reset []
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
  bot:
    environment:
      NODE_ENV: production
  postgres:
    ports: !reset []
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api]
    restart: unless-stopped

volumes:
  caddy_data:
